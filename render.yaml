services:
  - type: web
    name: asan-union-carrental
    runtime: node
    plan: free
    # NODE_ENV=production이 설정되어 있으면 Render가 npm install 시 devDependencies(vite,
    # typescript 등 빌드에 필요한 패키지)를 건너뛰어 빌드가 실패한다 — 명시적으로 포함시킨다.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Neon(별도 관리형 Postgres)의 연결 문자열을 Render 대시보드에서 직접 입력한다.
      # (Render 계정 무료 플랜은 자체 PostgreSQL을 1개까지만 허용하므로, 이 조직의 기존 앱들과
      # 동일하게 Neon을 사용한다 — asan-union-partners README/이력 참고.)
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://asan-union-carrental.onrender.com
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
